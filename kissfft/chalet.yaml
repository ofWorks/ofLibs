name: oflibs
version: "1.0"
externalDependencies:
  kissfft:
    repository: https://github.com/mborgerding/kissfft
    commit: "e5e3fac46e0d"
    kind: git

targets:
  kissfft:
    kind: cmakeProject
    location: ${external:${name}}
    recheck: false
    rebuild: false
    install: true
    defines:
      - CMAKE_INSTALL_INCLUDEDIR=include
      - CMAKE_INSTALL_PREFIX=install
      # - CMAKE_INSTALL_LIBDIR=lib
      - CMAKE_INSTALL_LIBDIR=lib
      - BUILD_SHARED_LIBS=OFF
      - CMAKE_BUILD_TYPE=Release
      # The runtime line below is ignored unless policy CMP0091 is NEW, and this
      # project's cmake_minimum_required 3.10 predates 3.15 — without the default the lib
      # silently builds /MD and a /MT link warns LNK4217/LNK4286 (Oct 2026).
      - CMAKE_POLICY_DEFAULT_CMP0091=NEW
      - CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - KISSFFT_PKGCONFIG=OFF
      - KISSFFT_STATIC=ON
      - KISSFFT_TOOLS=OFF
      - KISSFFT_TEST=OFF
    defines[platform:macos]:
      - CMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - CMAKE_OSX_ARCHITECTURES=x86_64;arm64

distribution:
  kissfft:
    kind: archive
    format: zip
    include:
      - ${externalBuild:${name}}/install/lib
      - ${externalBuild:${name}}/install/include
      - ${external:${name}}/COPYING
      - ${external:${name}}/LICENSES
