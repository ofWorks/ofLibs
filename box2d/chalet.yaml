name: oflibs
version: 3.1.1

externalDependencies:
  box2d:
    repository: https://github.com/erincatto/box2d
    # last working commit: 617d32a (Tunable ccd #1093, 2026-08-20)
    # 02179697fd8a (Deferred restitution #1094) breaks GCC aarch64 builds:
    # b2SoftMaskW in src/contact_solver.c assigns uint32x4_t to int32x4_t.
    # reported upstream: https://github.com/erincatto/box2d/commit/02179697fd8a9e84b613020eb6ec56441408ae8d
    commit: "02179697fd8a"
    kind: git

targets:
  box2d:
    kind: cmakeProject
    location: ${external:${name}}
    recheck: false
    rebuild: false
    install: true
    defines:
      - BUILD_SHARED_LIBS=OFF
      - CMAKE_BUILD_TYPE=Release
      - CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - BOX2D_SAMPLES=OFF
      - BOX2D_BENCHMARKS=OFF
      - BOX2D_UNIT_TESTS=OFF
      - BOX2D_DOCS=OFF
      - CMAKE_INSTALL_PREFIX=install
      - CMAKE_INSTALL_INCLUDEDIR=include
      - CMAKE_INSTALL_LIBDIR=lib
    defines[platform:macos]:
      - CMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - CMAKE_OSX_ARCHITECTURES=x86_64;arm64

distribution:
  box2d:
    kind: archive
    format: zip
    include:
      - ${externalBuild:${name}}/install/lib
      - ${externalBuild:${name}}/install/include
      - ${external:${name}}/README.md
      - ${external:${name}}/LICENSE
