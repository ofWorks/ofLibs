name: oflibs
version: "1.0"
externalDependencies:
  uriparser:
    repository: https://github.com/uriparser/uriparser
    # tag: uriparser-0.9.9
    commit: "35a929905323"
    kind: git
targets:
  uriparser:
    kind: cmakeProject
    location: ${external:${name}}
    recheck: false
    rebuild: false
    install: true
    defines:
      # - CMAKE_ARCHIVE_OUTPUT_DIRECTORY=lib
      - BUILD_SHARED_LIBS=OFF
      - BUILD_STATIC_LIBS=ON
      - CMAKE_BUILD_TYPE=Release

      - CMAKE_INSTALL_PREFIX=install
      - CMAKE_INSTALL_LIBDIR=lib
      - CMAKE_INSTALL_INCLUDEDIR=include

      - URIPARSER_BUILD_DOCS=OFF
      - URIPARSER_BUILD_TESTS=OFF
      - URIPARSER_BUILD_TOOLS=OFF
      - URIPARSER_ENABLE_INSTALL=ON
      - URIPARSER_SHARED_LIBS=OFF
      - URI_STATIC_BUILD=ON # ADD THIS LINE

    defines[env:ANDROID_ABI]:
      - CMAKE_TOOLCHAIN_FILE=${env:ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake
      - CMAKE_ANDROID_ARCH_ABI=${env:ANDROID_ABI}
      - ANDROID_ABI=${env:ANDROID_ABI}
      - ANDROID_API=${env:ANDROID_API}
      - ANDROID_PLATFORM=${env:ANDROID_PLATFORM}
      - ANDROID_TOOLCHAIN=clang
      - ANDROID_NDK=${env:ANDROID_NDK_ROOT}
      - ANDROID_NDK_ROOT=${env:ANDROID_NDK_ROOT}
      - ANDROID_STL=c++_static
      - CMAKE_POSITION_INDEPENDENT_CODE=ON
      - ENABLE_VISIBILITY=OFF

    defines[toolchain:msvc]:
      # - CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded # For /MT (static runtime)
      # - CMAKE_C_FLAGS=/MT /DURI_STATIC_BUILD
      # - CMAKE_CXX_FLAGS=/MT /DURI_STATIC_BUILD
      # - CMAKE_C_FLAGS_INIT=/MT /DURI_STATIC_BUILD
      # - CMAKE_CXX_FLAGS_INIT=/MT /DURI_STATIC_BUILD

      - CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - CMAKE_C_FLAGS_RELEASE=/MT /O2 /Ob2 /DNDEBUG /DURI_STATIC_BUILD
      - CMAKE_CXX_FLAGS_RELEASE=/MT /O2 /Ob2 /DNDEBUG /DURI_STATIC_BUILD
      - CMAKE_C_FLAGS=/MT /DURI_STATIC_BUILD
      - CMAKE_CXX_FLAGS=/MT /DURI_STATIC_BUILD

    defines[platform:macos]:
      - CMAKE_OSX_ARCHITECTURES=x86_64;arm64
      - CMAKE_OSX_DEPLOYMENT_TARGET=11.0

distribution:
  uriparser:
    kind: archive
    format: zip
    include:
      - ${external:${name}}/COPYING**
      # - ${external:${name}}/include
      - ${externalBuild:${name}}/install/include
      - ${externalBuild:${name}}/install/lib
