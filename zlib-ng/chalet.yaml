name: oflibs
version: "1.0"
externalDependencies:
  zlib-ng:
    repository: https://github.com/zlib-ng/zlib-ng
    # Pinned to latest commit with working zlib-ng
    # commit: ec2f43e910be013720da5d699669bd6b7298efac
    commit: "4d7c051d5086"
    # tag: 2.2.5
    kind: git

targets:
  zlib-ng:
    kind: cmakeProject
    location: ${external:${name}}
    recheck: false
    rebuild: false
    install: true
    # Build only the library target. The utility executables (minigzip,
    # minideflate, makefixed, ...) are never installed or distributed, and
    # linking them under emscripten crashes wasm-opt ("popping from empty
    # stack"). zlib-ng has no CMake option to skip them, so restrict the build.
    targets:
      - zlib-ng
    defines:
      - CMAKE_BUILD_TYPE=Release
      - BUILD_SHARED_LIBS=OFF # not working on zlib
      - CMAKE_POSITION_INDEPENDENT_CODE=ON
      - CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      # - CMAKE_INSTALL_PREFIX=install
      - ZLIB_ENABLE_TESTS=OFF
      - ZLIBNG_ENABLE_TESTS=OFF
      - WITH_GTEST=OFF
      # - WITH_NATIVE_INSTRUCTIONS=ON
      - ZLIB_COMPAT=ON
    defines[platform:web]:
      - JS_ONLY=ON
      - CMAKE_EXECUTABLE_SUFFIX=.js
    defines[env:ANDROID_ABI]:
      - CMAKE_TOOLCHAIN_FILE=${env:ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake
      - CMAKE_ANDROID_ARCH_ABI=${env:ANDROID_ABI}
      - ANDROID_ABI=${env:ANDROID_ABI}
      - ANDROID_API=${env:ANDROID_API}
      - ANDROID_PLATFORM=${env:ANDROID_PLATFORM}
      - ANDROID_TOOLCHAIN=clang
      - ANDROID_NDK=${env:ANDROID_NDK_ROOT}
      - ANDROID_NDK_ROOT=${env:ANDROID_NDK_ROOT}
      - ANDROID_STL=c++_static
      - WITH_NATIVE_INSTRUCTIONS=OFF
      - WITH_GZFILEOP=ON
      - ENABLE_VISIBILITY=OFF
    defines[platform:macos]:
      - CMAKE_OSX_ARCHITECTURES=arm64;x86_64
      - CMAKE_OSX_DEPLOYMENT_TARGET=11.0

distribution:
  zlib-ng:
    kind: archive
    format: zip
    include:
      - ${external:${name}}/LICENSE**
      - ${externalBuild:${name}}/install/include
      - ${externalBuild:${name}}/install/lib
