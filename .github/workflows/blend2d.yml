name: blend2d

on:
  push:
    paths:
      - blend2d/**
      - .github/workflows/blend2d.yml

jobs:
  ci:
    permissions:
      contents: write

    uses: ./.github/workflows/_build.yml
    with: {
        lib: blend2d,
        version: add,
        # asmjit (axl/commons.h) relies on C++20 P0634 "Down with typename",
        # which needs Clang >= 16; ubuntu-22.04 ships Clang 14, so Linux uses
        # ubuntu-24.04 (Clang 18), same as dawn.yml.
        platforms: '[
          {"platform":"linux64","os":"ubuntu-24.04","toolchain":"llvm"},
          {"platform":"macos","os":"macos-26","toolchain":"apple-llvm"},
          {"platform":"vs","os":"windows-2022","toolchain":"vs-stable"},
          {"platform":"emscripten","os":"ubuntu-latest","toolchain":"emscripten"},
          {"platform":"rpi-aarch64","os":"ubuntu-22.04-arm","prefix":"aarch64-linux-gnu","toolchain":"aarch64-linux-gnu-gcc-12"}
          ]',
      }
    secrets: inherit
# bump 2026-07-24: rebuild on windows-2022 (MSVC 14.4x) runner pin
