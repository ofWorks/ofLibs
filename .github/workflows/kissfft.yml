name: kissfft

on:
  push:
    paths:
      - .github/workflows/kissfft.yml
      - kissfft/**

jobs:
  ci:
    permissions:
      contents: write

    uses: ./.github/workflows/_build.yml
    with: { lib: kissfft, version: v1.0 }
    secrets: inherit
