name: ofLibs Cairo
version: 1.18.4 #

externalDependencies:
  cairo:
    repository: https://gitlab.freedesktop.org/cairo/cairo
    # tag: 1.18.4
    commit: "7e71c0d18a13"
    kind: git
targets:
  cairo:
    kind: mesonProject
    location: ${external:${name}}
    install: true
    defines:
      - buildtype=release
      - default_library=static

      - pixman:default_library=static

      # Disable tests (pixman's too: its test/demo executables are built by
      # default and fail to link under emscripten)
      - tests=disabled
      - pixman:tests=disabled
      - pixman:demos=disabled

      # Disable X11 backends
      - xcb=disabled
      - xlib=disabled

      # Disable compression
      - lzo=disabled
      # zlib is required for PDF support

      # Disable font/text backends
      - dwrite=disabled
      - fontconfig=disabled
      - freetype=disabled

      #- trace=disabled ## doesnt work, not trace or dtrace

      # Disable GObject introspection and bindings
      - glib=disabled

      # Disable utilities
      - gtk2-utils=disabled
      - symbol-lookup=disabled

      # Disable image formats you don't need
      # png is required for SVG support

      # Disable additional features
      - tee=disabled
      - spectre=disabled

    defines[toolchain:{aarch64-linux-gnu-gcc,arm-linux-gnueabihf-gcc}]:
      - pixman:mmx=disabled
      - pixman:sse2=disabled
      - pixman:ssse3=disabled
      - pixman:vmx=disabled

    defines[toolchain:msvc]:
      # With dwrite=disabled cairo's meson.build targets _WIN32_WINNT_VISTA, but
      # src/win32/cairo-win32-system.c (since 100d249d, "WICFactory: Make
      # thread-safe") uses CO_MTA_USAGE_COOKIE, which the SDK only declares for
      # Windows 8+. c_args come after project args in meson, so this overrides.
      - c_args=-D_WIN32_WINNT=_WIN32_WINNT_WIN8 -DWINVER=_WIN32_WINNT_WIN8
      - cpp_args=-D_WIN32_WINNT=_WIN32_WINNT_WIN8 -DWINVER=_WIN32_WINNT_WIN8

    defines[platform:macos]:
      - c_args=-mmacos-version-min=11.0
      - cpp_args=-mmacos-version-min=11.0

    defines[:web]:
      # ADD THIS SECTION FOR EMSCRIPTEN
      # Disable mutex/threading - Cairo's mutex implementation doesn't work with Emscripten
      # Disable C11 atomics detection - forces fallback to GCC legacy atomics which are compatible with pixman
      - c_args=-DCAIRO_NO_MUTEX=1 -D_REENTRANT -DATOMIC_POINTER_LOCK_FREE=0
      - cpp_args=-DCAIRO_NO_MUTEX=1 -D_REENTRANT -DATOMIC_POINTER_LOCK_FREE=0
      - c_link_args=-sWASM=1 -sERROR_ON_UNDEFINED_SYMBOLS=1
      - cpp_link_args=-sWASM=1 -sERROR_ON_UNDEFINED_SYMBOLS=1

distribution:
  cairo:
    kind: archive
    format: zip
    include:
      # - *
      - ${external:${name}}/COPYING*
      - ${externalBuild:${name}}/install/include
      - ${externalBuild:${name}}/install/lib

    # - !${externalBuild:${name}}/install/lib/cairo
    # exclude:
    # - ${externalBuild:${name}}/install/lib/cairo
