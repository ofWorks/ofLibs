name: oflibs
version: "1.0"
externalDependencies:
  rplidar:
    repository: https://github.com/dimitre/rplidar_sdk
    branch: braid
    # Pin the tip of braid, not its upstream base (99478e5fb90d): the
    # __APPLE__ patches to hal/locker.h and hal/event.h live only on braid.
    commit: "99478e5fb90d"
    kind: git

targets:
  rplidar:
    kind: script
    file: build_rplidar.sh
    arguments:
      - ${external:${name}}

distribution:
  rplidar:
    kind: archive
    format: zip
    include:
      - ${external:${name}}/stage/lib
      - ${external:${name}}/stage/include
      - ${external:${name}}/LICENSE
